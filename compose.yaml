# My Health Spend, Release 1 local stack (ARCHITECTURE.md "Environments", ADR-030, ADR-031).
#
#   docker compose up --build                        app on http://127.0.0.1:3063
#   docker compose --profile test run --rm tests     full suite against the stack, through `capture`
#
# Synthetic data only. Only `app` publishes a port, on 127.0.0.1. Secrets are generated by `setup` into the
# `secrets` volume on first run; each service mounts only its own folder of it.

name: mhs

x-image: &image
  image: mhs:dev
  build:
    context: .
    target: runtime

x-secrets: &secrets
  type: volume
  source: secrets
  read_only: true
  target: /run/secrets/mhs

services:
  setup:
    <<: *image
    user: "0"
    command: ["mhs-stack", "init-secrets", "/secrets"]
    network_mode: none
    volumes:
      - secrets:/secrets

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mhs
      POSTGRES_PASSWORD_FILE: /run/secrets/mhs/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - { <<: *secrets, volume: { subpath: postgres } }
    networks: [backend]
    depends_on:
      setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "mhs"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *image
    command: ["mhs-stack", "migrate"]
    environment:
      MHS_DB_HOST: postgres
      MHS_DB_NAME: mhs
      MHS_DB_ADMIN_PASSWORD_FILE: /run/secrets/mhs/admin_password
      MHS_DB_APP_PASSWORD_FILE: /run/secrets/mhs/db_app_password
      MHS_DB_WORKER_PASSWORD_FILE: /run/secrets/mhs/db_worker_password
      MHS_DB_VAULT_PASSWORD_FILE: /run/secrets/mhs/db_vault_password
    volumes:
      - { <<: *secrets, volume: { subpath: migrate } }
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  vault:
    <<: *image
    command: ["mhs-vault", "serve"]
    environment:
      MHS_HOST: 0.0.0.0
      MHS_DB_HOST: postgres
      MHS_DB_USER: mhs_vault
      MHS_DB_PASSWORD_FILE: /run/secrets/mhs/db_password
      MHS_VAULT_TOKEN_FILE: /run/secrets/mhs/vault_token
      MHS_KEY_FILE: /run/secrets/mhs/kek
    volumes:
      - { <<: *secrets, volume: { subpath: vault } }
      - vault-backups:/backups
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: &http-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    <<: *image
    command: ["mhs-app"]
    environment:
      MHS_HOST: 0.0.0.0
      MHS_APP_PORT: "3063"
      MHS_DB_HOST: postgres
      MHS_DB_USER: mhs_app
      MHS_DB_PASSWORD_FILE: /run/secrets/mhs/db_password
      MHS_VAULT_URL: http://vault:8100
      MHS_VAULT_TOKEN_FILE: /run/secrets/mhs/vault_token
      MHS_KEY_FILE: /run/secrets/mhs/kek
      MHS_OBJECTS_DIR: /srv/objects
      MHS_OCR_ENGINE: tesseract  # photos and scanned PDFs (ADR-029)
      MHS_SCRUBBER: presidio     # identifier detection on top of the rules (ADR-029)
    ports:
      - "127.0.0.1:3063:3063"
    volumes:
      - { <<: *secrets, volume: { subpath: app } }
      - originals:/srv/objects
    networks: [frontend, backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      vault: { condition: service_healthy }
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:3063/health', timeout=2)"]

  worker:
    <<: *image
    command: ["mhs-worker"]
    environment:
      MHS_DB_HOST: postgres
      MHS_DB_USER: mhs_worker
      MHS_DB_PASSWORD_FILE: /run/secrets/mhs/db_password
      MHS_EXTRACTOR: rules  # `claude` lets it take AI extraction jobs (ADR-034; needs an API key and a way out)
    volumes:
      - { <<: *secrets, volume: { subpath: worker } }
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # --- test profile -------------------------------------------------------------------------

  capture:
    profiles: [test]
    image: mitmproxy/mitmproxy:11.1.3
    command: ["mitmdump", "--listen-port", "8080", "--set", "block_global=false", "-s", "/addons/log_flows.py"]
    environment:
      CAPTURE_LOG: /home/mitmproxy/.mitmproxy/flows.jsonl
      CAPTURE_AI_HOST: ai.capture.test
      CAPTURE_AI_RECORDINGS: /recorded
    volumes:
      - ./docker/capture:/addons:ro
      - ./tests/fixtures/ai:/recorded:ro
      - captures:/home/mitmproxy/.mitmproxy  # an image folder the proxy's own user can write
    networks: [frontend, backend]  # the browser's path to the app, and the AI worker's only way out

  worker-ai:
    # A worker with Claude extraction on (MHS_EXTRACTOR=claude). It has no route out of the backend network, so its
    # AI calls go through `capture`, which answers them with recorded responses and logs every request for the
    # TC-PLT-04-1 check. Nothing reaches the real API and no key is needed.
    <<: *image
    profiles: [test]
    command: ["mhs-worker"]
    environment:
      MHS_DB_HOST: postgres
      MHS_DB_USER: mhs_worker
      MHS_DB_PASSWORD_FILE: /run/secrets/mhs/db_password
      MHS_EXTRACTOR: claude
      MHS_ANTHROPIC_API_KEY: test-key-not-real
      MHS_AI_BASE_URL: http://ai.capture.test
      MHS_AI_PROXY: http://capture:8080
    volumes:
      - { <<: *secrets, volume: { subpath: worker } }
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      capture: { condition: service_started }

  fake-gcs:
    profiles: [test]
    # Stands in for Cloud Storage so the GCS object store (ADR-036) is tested without a Google account.
    image: fsouza/fake-gcs-server:1.50.2
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-public-host", "fake-gcs:4443"]
    networks: [frontend]

  tests:
    profiles: [test]
    image: mhs:test
    build:
      context: .
      target: test
    command: ["pytest", "-q", "-rs", "-p", "no:cacheprovider"]
    environment:
      # Unit and integration tests: a fresh database and roles per session on the stack's Postgres.
      MHS_TEST_DB_HOST: postgres
      MHS_TEST_DB_ADMIN_PASSWORD_FILE: /run/secrets/mhs-migrate/admin_password
      # Stack tests: the running app, reached through the capture proxy.
      MHS_STACK_URL: http://app:3063
      MHS_TEST_GCS_ENDPOINT: http://fake-gcs:4443
      MHS_STACK_PROXY: http://capture:8080
      MHS_STACK_CAPTURE_LOG: /captures/flows.jsonl
      MHS_STACK_OBJECTS_DIR: /srv/objects
      MHS_DB_HOST: postgres
      MHS_DB_USER: mhs_app
      MHS_DB_PASSWORD_FILE: /run/secrets/mhs/db_password
      MHS_KEY_FILE: /run/secrets/mhs/kek
    volumes:
      - { <<: *secrets, volume: { subpath: app } }
      - { <<: *secrets, target: /run/secrets/mhs-migrate, volume: { subpath: migrate } }
      - { type: volume, source: originals, target: /srv/objects, read_only: true }
      - captures:/captures:ro
    networks: [frontend, backend]
    depends_on:
      app: { condition: service_healthy }
      worker: { condition: service_started }
      worker-ai: { condition: service_started }
      capture: { condition: service_started }
      fake-gcs: { condition: service_started }

networks:
  frontend: {}
  backend:
    internal: true  # postgres, vault and worker have no route out

volumes:
  secrets: {}
  pgdata: {}
  originals: {}
  vault-backups: {}
  captures: {}
