<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Health Spend{% endblock %} · MH$</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/household.css">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="/"><img src="/static/favicon.svg" alt="">My Health Spend</a>
    {% if session %}
    <div class="icons">
      <span class="muted small">{{ session.display_name }}</span>
      <form method="post" action="/signout">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <button class="btn small" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
