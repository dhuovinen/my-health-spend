{% extends "base.html" %}
{% block title %}Verification code{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Verification code</h1>
  <p class="muted">Enter the 6-digit code from your authenticator app.</p>
  {% if error %}<p class="alert bad">{{ error }}</p>{% endif %}
  <form method="post" action="/signin/mfa" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="small"><a href="/signin">Start again</a></p>
</section>
{% endblock %}
