{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Sign in</h1>
  {% if error %}<p class="alert bad">{{ error }}</p>{% endif %}
  <form method="post" action="/signin" class="stack">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Continue</button>
  </form>
  <p class="small"><a href="/recover">Forgot your password or lost your phone?</a></p>
</section>
{% endblock %}
