<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Health Spend{% endblock %} · MH$</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% set path = request.url.path %}
<header class="topbar">
  <div class="inner">
    <a class="brand" href="/"><img src="/static/favicon.svg" alt="">My Health Spend</a>
    {% if show_nav %}
    <nav class="nav">
      <a href="/" class="{{ 'active' if path == '/' }}">Home</a>
      <a href="/visits" class="{{ 'active' if path.startswith('/visits') }}">Visits</a>
      <a href="/providers" class="{{ 'active' if path.startswith('/providers') }}">Providers</a>
      <a href="/import" class="{{ 'active' if path.startswith('/import') }}">Import</a>
      {% if session %}<a href="/uploads" class="{{ 'active' if path.startswith('/uploads') }}">Uploads</a>{% endif %}
    </nav>
    <div class="icons">
      <a class="icon-btn {{ 'active' if path.startswith('/help') }}" href="/help" title="Help" aria-label="Help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </a>
      <a class="icon-btn {{ 'active' if path.startswith('/settings') }}" href="/settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      {% if session %}
      <span class="muted small member-name">{{ session.display_name }}</span>
      <form method="post" action="/signout">{{ csrf_input() }}<button class="btn small" type="submit">Sign out</button></form>
      {% endif %}
    </div>
    {% endif %}
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
