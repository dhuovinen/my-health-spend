[project]
name = "mhs"
version = "0.1.0"
description = "My Health Spend: reconcile insurer claims, provider statements and HSA payments."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "httpx>=0.27",
    "pypdf>=5",
    "openpyxl>=3.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "pypdfium2>=5.14.0",
    "presidio-analyzer>=2.2.364",
    "en-core-web-md",
    "anthropic>=1.15.0",
]

[project.scripts]
mhs = "mhs.web.server:main"
mhs-app = "mhs.web.household.app:main"
mhs-worker = "mhs.ingest.worker:main"
mhs-vault = "mhs.vault.cli:main"
mhs-admin = "mhs.web.household.admin:main"
mhs-stack = "mhs.stack:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mhs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a Postgres server (MHS_TEST_DATABASE_ADMIN_URL, or Docker to start a throwaway one)",
    "stack: runs against the live compose stack (docker compose --profile test run --rm tests)",
]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
